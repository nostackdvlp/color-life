<style>
:root{
  --bg:#f3eee4; --paper:#fbf8f2; --ink:#2a2622; --muted:#7a7166; --line:#ddd4c5;
  --chip:#ebe4d7; --accent:#b4432f; --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1917; --paper:#24211e; --ink:#ece6dc; --muted:#a39888; --line:#3a352f;
    --chip:#2f2b27; --accent:#e07a62; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1917; --paper:#24211e; --ink:#ece6dc; --muted:#a39888; --line:#3a352f;
  --chip:#2f2b27; --accent:#e07a62; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 96px max(16px,env(safe-area-inset-left))}
.install{font-size:12px;padding:5px 12px;color:var(--accent);border-color:var(--accent)}
[hidden]{display:none!important}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.jp{font-family:"Noto Serif JP",serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:28px;font-weight:600;letter-spacing:.01em}
.brand .jp{font-size:15px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--chip);color:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{padding:10px 4px 9px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"] svg{color:var(--accent)}
nav.tabs svg{width:20px;height:20px}

.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daybar .date{text-align:center;flex:1}
.daybar .date b{display:block;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600}
.daybar .date span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.today-link{font-size:12px;color:var(--accent);margin-top:2px}

.palette{display:flex;height:min(52vh,420px);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.sw{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 12px;text-align:left;transition:flex .35s ease;min-width:0}
.sw:hover{flex:1.25}
.sw .nm{font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:600;line-height:1.15}
.sw .hx{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-top:4px}
.sw .role{position:absolute;top:12px;left:12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.sw.light{color:#2a2622}.sw.dark{color:#fbf8f2}

.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 2px 18px}
.meta .num{color:var(--muted);font-size:13px}
.meta .num b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:6px}
.pill{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;background:var(--paper)}
.pill:hover{border-color:var(--muted)}
.pill.on{color:var(--accent);border-color:var(--accent)}
.pill svg{width:15px;height:15px}

.mood{background:var(--paper);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.mood h2{margin:0 0 4px;font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;line-height:1.15}
.mood p{margin:0;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink)}

.ratio{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 6px}
.ratio-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--paper);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 svg{width:16px;height:16px}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.card li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}
.dot{width:18px;height:18px;border-radius:50%;margin-top:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.card li b{font-weight:600}
.card .note{margin:10px 0 0;font-size:13px;color:var(--muted)}

.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 14px}
.section-title h2{margin:0;font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600}
.section-title span{color:var(--muted);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mini{background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);text-align:left;display:block;width:100%}
.mini .strip{display:flex;height:84px}
.mini .strip i{flex:1}
.mini .cap{padding:7px 10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.mini:hover{transform:translateY(-2px)}
.mini{transition:transform .15s}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.cbtn{text-align:left;background:var(--paper);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.cbtn i{display:block;height:58px}
.cbtn span{display:block;padding:6px 8px;font-size:11.5px;line-height:1.3;min-height:42px}
.cbtn[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.picked{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.picked i{width:44px;height:44px;border-radius:10px;flex:none}
.picked b{font-family:"Cormorant Garamond",serif;font-size:21px;display:block;line-height:1.1}
.picked small{color:var(--muted)}
.picked button{margin-left:auto}

.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty .serif{font-size:24px;color:var(--ink);display:block;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

dialog{border:0;border-radius:18px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,15,10,.45)}
dialog .dl{padding:18px}
dialog .close{position:absolute;top:10px;right:10px;background:var(--paper)}
.about p{margin:0 0 10px}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}

@media (max-width:560px){
  .palette{flex-direction:column;height:auto}
  .sw{min-height:96px;flex:none}
  .sw:hover{flex:none}
  .sw .role{top:auto;bottom:14px;left:auto;right:12px}
  .brand h1{font-size:24px}
}
</style>
</head>

<script>
// ---------- utils ----------
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = i => ({ i, name: COLORS[i][0], hex: COLORS[i][1], L: COLORS[i][2], ch: COLORS[i][3], h: COLORS[i][4], cmyk: COLORS[i][5] });
const combo = n => COMBOS[n-1].map(C);           // n = 1..348
const TOTAL = COMBOS.length;
const plural = (n,a,b,c) => { const m10=n%10, m100=n%100; return m10===1&&m100!==11 ? a : m10>=2&&m10<=4&&(m100<12||m100>14) ? b : c; };

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1400); }
function copy(hex){ (navigator.clipboard?.writeText(hex) ?? Promise.reject()).then(()=>toast('Скопировано: '+hex.toUpperCase()), ()=>toast(hex.toUpperCase())); }

// ---------- daily pick: seeded permutation, all 348 before repeating ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const ORDER = (() => { const r = mulberry32(1933); const a = Array.from({length:TOTAL},(_,i)=>i+1); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; })();
const EPOCH = Date.UTC(2026,0,1);
const dayIndex = d => Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 864e5);
const comboForDate = d => ORDER[((dayIndex(d) % TOTAL) + TOTAL) % TOTAL];

// ---------- color reasoning ----------
const isWarm = c => c.ch > 8 && (c.h < 100 || c.h > 330);
const isCool = c => c.ch > 8 && c.h >= 150 && c.h <= 320;
const isNeutral = c => c.ch <= 12;

function hueWord(c){
  if (c.ch <= 8) return c.L > 80 ? 'светлый нейтральный' : c.L < 30 ? 'глубокий тёмный' : 'серо-нейтральный';
  const h = c.h;
  if (h < 20 || h >= 345) return 'розово-красный';
  if (h < 45) return 'красный';
  if (h < 70) return 'оранжево-терракотовый';
  if (h < 95) return 'жёлто-охристый';
  if (h < 115) return 'жёлтый';
  if (h < 150) return 'оливково-зелёный';
  if (h < 200) return 'зелёный';
  if (h < 240) return 'сине-зелёный';
  if (h < 290) return 'синий';
  if (h < 320) return 'фиолетовый';
  return 'пурпурный';
}

// роли: база (самый спокойный), акцент (самый насыщенный), остальные — поддержка
function roles(cs){
  const byCh = [...cs].sort((a,b)=> (a.ch - b.ch) || (Math.abs(50-b.L) - Math.abs(50-a.L)));
  const base = byCh[0];
  const accent = byCh[byCh.length-1];
  const support = cs.filter(c => c !== base && c !== accent);
  return { base, support, accent };
}

function mood(cs){
  const avgL = cs.reduce((s,c)=>s+c.L,0)/cs.length;
  const avgC = cs.reduce((s,c)=>s+c.ch,0)/cs.length;
  const contrast = Math.max(...cs.map(c=>c.L)) - Math.min(...cs.map(c=>c.L));
  const warm = cs.filter(isWarm).length, cool = cs.filter(isCool).length;
  const tags = [];
  tags.push(avgC > 45 ? 'насыщенно' : avgC > 25 ? 'сбалансированно' : 'приглушённо');
  tags.push(avgL > 68 ? 'светло' : avgL < 42 ? 'глубоко' : 'средние тона');
  tags.push(contrast > 50 ? 'контрастно' : contrast < 22 ? 'тон-в-тон' : 'мягкий контраст');
  tags.push(warm > cool ? 'тёплая гамма' : cool > warm ? 'холодная гамма' : 'смешанная гамма');

  let title, text;
  if (avgC > 45 && contrast > 40) { title = 'День смелых решений'; text = 'Яркое, звонкое сочетание. Хорошо для встреч, где важно, чтобы вас заметили и запомнили.'; }
  else if (avgC > 45) { title = 'Праздничное настроение'; text = 'Сочные цвета близкой светлоты — радостно, но без резкости. Подходит для выходных и прогулок.'; }
  else if (avgL > 68 && avgC < 30) { title = 'Лёгкость и воздух'; text = 'Светлая, разреженная палитра. Создаёт ощущение простора и спокойной ясности.'; }
  else if (avgL < 42) { title = 'Вечерняя глубина'; text = 'Тёмные, плотные тона. Собранность, достоинство, немного тайны — хорошо для вечера и важных разговоров.'; }
  else if (contrast > 50) { title = 'Ясный характер'; text = 'Сильный контраст светлого и тёмного даёт чёткую графичную картинку — выглядит уверенно и собранно.'; }
  else if (avgC < 22) { title = 'Тихая элегантность'; text = 'Приглушённые, «пыльные» оттенки. Спокойствие и вкус без лишних слов — день для сосредоточенной работы.'; }
  else if (warm > cool) { title = 'Тёплый уют'; text = 'Тёплая гамма согревает и располагает. Хорошо для дружеских встреч и домашних дел.'; }
  else if (cool > warm) { title = 'Свежесть и ясность'; text = 'Прохладные тона освежают и помогают думать. Удачный день для учёбы и планирования.'; }
  else { title = 'Гармония противоположностей'; text = 'Тёплое и холодное уравновешивают друг друга — универсальное сочетание на любой случай.'; }
  return { title, text, tags };
}

function wardrobe(r){
  const b = r.base, a = r.accent;
  const baseItems = b.L < 40 ? 'пальто, брюки или юбка' : b.L > 75 ? 'рубашка, трикотаж или светлый костюм' : 'жакет, брюки или платье';
  const items = [[b, `<b>Основа</b> — ${esc(b.name)}: ${baseItems}. Самая большая площадь образа.`]];
  const supItems = ['рубашка, водолазка или шарф', 'вторая вещь слоя — кардиган, жилет, носки'];
  r.support.forEach((c,i)=> items.push([c, `<b>Поддержка</b> — ${esc(c.name)}: ${supItems[i] || 'деталь слоя'}.`]));
  if (a !== b) items.push([a, `<b>Акцент</b> — ${esc(a.name)}: ${a.ch > 40 ? 'сумка, обувь или серьги' : 'платок, ремень, часы или оправа'}.`]);
  return items;
}

function interior(r){
  const b = r.base, a = r.accent;
  const items = [[b, `<b>${esc(b.name)}</b> — ${b.L > 65 ? 'стены, крупный текстиль' : 'диван, ковёр или одна акцентная стена'}.`]];
  const sup = ['шторы, плед или покрывало', 'дерево, керамика, рамы картин'];
  r.support.forEach((c,i) => items.push([c, `<b>${esc(c.name)}</b> — ${sup[i]}.`]));
  if (a !== b) items.push([a, `<b>${esc(a.name)}</b> — подушки, ваза, цветы, обложки книг.`]);
  return items;
}

function extraTips(r, cs){
  const tips = [];
  const darkest = [...cs].sort((x,y)=>x.L-y.L)[0], lightest = [...cs].sort((x,y)=>y.L-x.L)[0];
  tips.push([lightest, `<b>Слайды и заметки:</b> фон — ${esc(lightest.name)}, текст — ${esc(darkest.name)}${r.accent!==darkest && r.accent!==lightest ? `, выделения — ${esc(r.accent.name)}` : ''}.`]);
  const food = { 'красный':'томаты, гранат, свёкла', 'розово-красный':'малина, редис, клубника', 'оранжево-терракотовый':'тыква, морковь, хурма', 'жёлто-охристый':'карри, мёд, запечённые орехи', 'жёлтый':'лимон, кукуруза, манго', 'оливково-зелёный':'оливки, авокадо, фисташки', 'зелёный':'зелень, огурцы, шпинат', 'сине-зелёный':'мятный чай, киви, водоросли', 'синий':'черника, голубика', 'фиолетовый':'баклажан, сливы, краснокочанная капуста', 'пурпурный':'инжир, ежевика, виноград' };
  const f = food[hueWord(r.accent)];
  if (f) tips.push([r.accent, `<b>На тарелке:</b> поддержите акцент едой — ${f}.`]);
  tips.push([r.base, `<b>Мелочи:</b> ${r.base.L > 65 ? 'светлая' : 'тёмная'} обложка блокнота, чехол, заставка телефона в тоне «${esc(r.base.name)}».`]);
  return tips;
}

// ---------- state ----------
const state = { tab:'today', date:new Date(), pinned:null, filter:0, pickedColor:null };
let favs = store.get('wada:favs', []);

function list(items){ return '<ul>' + items.map(([c,t]) => `<li><span class="dot" style="background:${c.hex}"></span><span>${t}</span></li>`).join('') + '</ul>'; }
const ICON = {
  heart:'<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  dice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>',
  shirt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 0 1-8 0z"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>',
  left:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18l6-6-6-6"/></svg>'
};

// ---------- views ----------
function viewDetail(n, opts = {}){
  const cs = combo(n), r = roles(cs), m = mood(cs);
  const fav = favs.includes(n);
  const roleOf = c => c === r.base ? 'основа' : c === r.accent ? 'акцент' : 'поддержка';
  const ratios = cs.length === 2 ? [[r.base,70],[r.accent,30]] : cs.length === 3 ? [[r.base,60],[r.support[0],30],[r.accent,10]] : [[r.base,50],[r.support[0],25],[r.support[1],15],[r.accent,10]];
  return `
  <div class="palette">${cs.map(c => `<button class="sw ${c.L>60?'light':'dark'}" style="background:${c.hex}" data-copy="${c.hex}" title="Нажмите, чтобы скопировать">
     <span class="role">${roleOf(c)}</span><span class="nm">${esc(c.name)}</span><span class="hx">${c.hex} · CMYK ${c.cmyk.join(' ')}</span></button>`).join('')}</div>
  <div class="meta">
    <span class="num">Сочетание <b>№ ${n}</b> из ${TOTAL} · ${cs.length} цвета</span>
    <span class="actions">
      ${opts.random ? `<button class="pill" data-act="random">${ICON.dice}Ещё</button>` : ''}
      <button class="pill" data-act="share" data-n="${n}">${ICON.share}<span class="hide-s">Поделиться</span></button>
      <button class="pill ${fav?'on':''}" data-act="fav" data-n="${n}" aria-pressed="${fav}">${ICON.heart.replace('FILL', fav?'currentColor':'none')}${fav?'В избранном':'Сохранить'}</button>
    </span>
  </div>
  <section class="mood">
    <h2>${m.title}</h2><p>${m.text}</p>
    <div class="ratio" aria-label="Пропорции цветов">${ratios.map(([c,p])=>`<i style="flex:${p};background:${c.hex}"></i>`).join('')}</div>
    <div class="ratio-legend"><span>Пропорции: ${ratios.map(([,p])=>p+'%').join(' / ')}</span><span>правило «база → акцент»</span></div>
    <div class="tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  </section>
  <div class="cards">
    <section class="card"><h3>${ICON.shirt}Образ</h3>${list(wardrobe(r))}</section>
    <section class="card"><h3>${ICON.home}Интерьер и стол</h3>${list(interior(r))}<p class="note">Один цвет — доминанта, остальные повторяйте 2–3 раза в комнате, чтобы палитра «читалась».</p></section>
    <section class="card"><h3>${ICON.spark}Мелочи дня</h3>${list(extraTips(r, cs))}</section>
  </div>`;
}

function viewToday(){
  const d = state.date;
  const isToday = dayIndex(d) === dayIndex(new Date());
  const n = state.pinned ?? comboForDate(d);
  const raw = d.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' }); const label = raw[0].toUpperCase() + raw.slice(1);
  return `
  <div class="daybar">
    <button class="icon-btn" data-act="prev" aria-label="Предыдущий день">${ICON.left}</button>
    <div class="date"><span>${state.pinned ? 'Случайное сочетание' : isToday ? 'Палитра дня' : 'Палитра на'}</span><b>${label}</b>
      ${(!isToday || state.pinned) ? `<button class="today-link" data-act="today">← вернуться к сегодняшней</button>` : ''}</div>
    <button class="icon-btn" data-act="next" aria-label="Следующий день">${ICON.right}</button>
  </div>
  ${viewDetail(n, { random:true })}`;
}

function miniCard(n){
  const cs = combo(n);
  return `<button class="mini" data-open="${n}"><span class="strip">${cs.map(c=>`<i style="background:${c.hex}"></i>`).join('')}</span><span class="cap"><span>№ ${n}</span><span>${favs.includes(n)?'♥':''}</span></span></button>`;
}

function viewAll(){
  const nums = Array.from({length:TOTAL},(_,i)=>i+1).filter(n => !state.filter || COMBOS[n-1].length === state.filter);
  return `<div class="section-title"><h2>Все сочетания</h2><span>${nums.length} шт.</span></div>
  <div class="filters">${[[0,'Все'],[2,'Из 2 цветов'],[3,'Из 3'],[4,'Из 4']].map(([v,l])=>`<button class="pill ${state.filter===v?'on':''}" data-filter="${v}">${l}</button>`).join('')}</div>
  <div class="grid">${nums.map(miniCard).join('')}</div>`;
}

function viewColors(){
  const pc = state.pickedColor;
  let top = `<div class="section-title"><h2>Мой цвет</h2><span>159 цветов Вады</span></div>
    <p style="margin:-6px 2px 14px;color:var(--muted)">Выберите цвет вещи, которую хотите надеть (или стен, дивана), — покажу, с чем Вада его сочетал.</p>`;
  if (pc !== null){
    const c = C(pc);
    const nums = COMBOS.map((cmb,i)=>cmb.includes(pc)?i+1:0).filter(Boolean);
    top += `<div class="picked"><i style="background:${c.hex}"></i><div><b>${esc(c.name)}</b><small>${c.hex} · ${hueWord(c)} · ${nums.length} ${plural(nums.length,'сочетание','сочетания','сочетаний')}</small></div><button class="pill" data-act="unpick">Другой цвет</button></div>
      <div class="grid" style="margin-bottom:24px">${nums.map(miniCard).join('')}</div>`;
    return top;
  }
  const order = COLORS.map((_,i)=>C(i)).sort((a,b)=> (isNeutral(a)-isNeutral(b)) || (isNeutral(a) ? b.L-a.L : ((a.h+10)%360)-((b.h+10)%360)) );
  return top + `<div class="cgrid">${order.map(c=>`<button class="cbtn" data-pick="${c.i}"><i style="background:${c.hex}"></i><span>${esc(c.name)}</span></button>`).join('')}</div>`;
}

function viewFav(){
  if (!favs.length) return `<div class="section-title"><h2>Избранное</h2></div><div class="empty"><span class="serif">Пока пусто</span>Нажмите «Сохранить» на понравившемся сочетании — оно появится здесь.</div>`;
  return `<div class="section-title"><h2>Избранное</h2><span>${favs.length} шт.</span></div><div class="grid">${favs.map(miniCard).join('')}</div>`;
}

function render(){
  const v = { today:viewToday, all:viewAll, colors:viewColors, fav:viewFav }[state.tab];
  $('#view').innerHTML = v();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === state.tab));
}

function openCombo(n){
  $('#dlgBody').innerHTML = viewDetail(n);
  const d = $('#dlg'); if (!d.open) d.showModal(); d.scrollTop = 0;
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab){ state.tab = t.dataset.tab; history.replaceState(null,'', state.tab==='today' ? location.pathname : '#'+state.tab); render(); scrollTo(0,0); return; }
  if (t.dataset.copy) return copy(t.dataset.copy);
  if (t.dataset.open) return openCombo(+t.dataset.open);
  if (t.dataset.filter !== undefined){ state.filter = +t.dataset.filter; return render(); }
  if (t.dataset.pick){ state.pickedColor = +t.dataset.pick; render(); return scrollTo(0,0); }
  const act = t.dataset.act;
  if (act === 'prev' || act === 'next'){ state.pinned = null; state.date = new Date(state.date.getFullYear(), state.date.getMonth(), state.date.getDate() + (act==='next'?1:-1)); return render(); }
  if (act === 'today'){ state.pinned = null; state.date = new Date(); return render(); }
  if (act === 'random'){ let n; do { n = 1 + Math.floor(Math.random()*TOTAL); } while (n === (state.pinned ?? comboForDate(state.date))); state.pinned = n; return render(); }
  if (act === 'unpick'){ state.pickedColor = null; return render(); }
  if (act === 'fav'){
    const n = +t.dataset.n;
    favs = favs.includes(n) ? favs.filter(x=>x!==n) : [n, ...favs];
    store.set('wada:favs', favs);
    toast(favs.includes(n) ? 'Сохранено в избранное' : 'Убрано из избранного');
    if ($('#dlg').open) openCombo(n);
    return render();
  }
  if (act === 'share'){
    const cs = combo(+t.dataset.n);
    const text = `Цвет дня — сочетание Сандзо Вады № ${t.dataset.n}:\n` + cs.map(c=>`${c.name} ${c.hex.toUpperCase()}`).join('\n');
    if (navigator.share) navigator.share({ text }).catch(()=>{});
    else (navigator.clipboard?.writeText(text) ?? Promise.reject()).then(()=>toast('Палитра скопирована'), ()=>toast('Не удалось скопировать'));
  }
});
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') e.target.close(); });

// theme
const applyTheme = th => { if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme; };
applyTheme(store.get('wada:theme', null));
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const th = dark ? 'light' : 'dark'; applyTheme(th); store.set('wada:theme', th);
};
$('#aboutBtn').onclick = () => {
  $('#dlgBody').innerHTML = `<div class="about"><div class="section-title"><h2>О приложении</h2></div>
  <p><b>Сандзо Вада</b> (1883–1967) — японский художник и исследователь цвета. В 1933–34 годах он издал шеститомник «Хайсёку Соокан» (配色総鑑), известный как <i>«A Dictionary of Color Combinations»</i>: 159 цветов и 348 проверенных сочетаний из двух, трёх и четырёх оттенков.</p>
  <p>Каждый день приложение выбирает одно сочетание из книги. Порядок перемешан так, что все 348 палитр пройдут прежде, чем начнутся повторы, а у всех пользователей в один день — одна и та же палитра.</p>
  <p>Советы по одежде и интерьеру строятся из самих цветов: самый спокойный становится основой, самый насыщенный — акцентом, пропорции — по правилу «60 / 30 / 10».</p>
  <p><b>Как установить на телефон.</b> iPhone: в Safari нажмите «Поделиться» → «На экран „Домой“». Android: в Chrome — меню ⋮ → «Установить приложение» (или кнопка «Установить» вверху). После первого открытия работает без интернета.</p>
  <p style="color:var(--muted);font-size:13px">Цвета на экране — приближение к печатным образцам книги. Нажмите на цвет, чтобы скопировать HEX.</p></div>`;
  $('#dlg').showModal();
};

// tabs via URL hash (ярлыки приложения: #colors, #fav, #all)
const TABS = ['today','all','colors','fav'];
const fromHash = () => { const h = location.hash.slice(1); if (TABS.includes(h)) state.tab = h; };
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); });

// новый день, пока приложение было открыто в фоне
let lastDay = dayIndex(new Date());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const now = dayIndex(new Date());
  if (now !== lastDay){ if (dayIndex(state.date) === lastDay && !state.pinned) state.date = new Date(); lastDay = now; render(); }
});

// PWA: service worker + кнопка установки
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
$('#installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt = null; $('#installBtn').hidden = true; };
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('Приложение установлено'); });

render();
</script>
</body>
</html>
